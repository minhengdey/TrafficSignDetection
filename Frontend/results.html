<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Traffic Sign Detection</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/results.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z" />
                    <path d="M2 17l10 5 10-5" />
                    <path d="M2 12l10 5 10-5" />
                </svg>
                <span>TrafficSign AI</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="upload.html" class="nav-link">Upload</a>
                <a href="#" class="nav-link" id="authLink">Login</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="results-container">
            <div class="results-body">
                <div class="video-section">
                    <div class="video-wrapper">
                        <video id="videoPlayer" controls></video>
                        <canvas id="detectionCanvas"></canvas>
                    </div>
                    <div class="video-controls">
                        <div class="playback-info">
                            <span id="currentTime">0:00</span>
                            <span class="separator">/</span>
                            <span id="totalTime">0:00</span>
                        </div>
                        <div class="detection-info">
                            <span id="currentDetections">No detections at this time</span>
                        </div>
                    </div>
                </div>
                <div class="detections-panel">
                    <div class="panel-header">
                        <h2>Detections</h2>
                        <div class="panel-controls">
                            <div class="filter-group">
                                <label for="signTypeFilter">Filter by type:</label>
                                <select id="signTypeFilter" class="filter-select">
                                    <option value="all">All Signs</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label for="confidenceFilter">Min confidence:</label>
                                <input type="range" id="confidenceFilter" min="0" max="100" value="0"
                                    class="confidence-slider">
                                <span id="confidenceValue">0%</span>
                            </div>
                        </div>
                    </div>

                    <div id="detectionsList" class="detections-list">
                    </div>
                </div>
            </div>
        </div>

    </main>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/results.js"></script>
</body>

</html>
